name: CI

on:
  pull_request:
  push:
    branches: [main, Jerome]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: Wealth-Bridge

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Wealth-Bridge/package-lock.json

      - name: Install
        run: npm ci

      # `next build` prerenders pages that initialise the Firebase client, so a
      # runner with no NEXT_PUBLIC_FIREBASE_* values fails on /dashboard. These
      # are public client config already committed in apphosting.yaml, so they
      # are derived from there rather than duplicated into secrets.
      - name: Generate build env from apphosting.yaml
        working-directory: .
        run: node scripts/apphosting-env.mjs --force

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Build
        run: npm run build
